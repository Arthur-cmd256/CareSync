services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: caresync-rabbitmq
    ports:
      - "5672:5672"    # porta AMQP (usada pelas aplicações)
      - "15672:15672"  # painel de administração web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  workspace:
    image: mcr.microsoft.com/devcontainers/java:1-21-bullseye
    container_name: caresync-workspace
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
    ports:
      - "8080:8080"  # agendamento-service
      - "8081:8081"  # notificacao-service