server:
  port: 8080

spring:
  application:
    name: agendamento-service
  datasource:
    url: jdbc:h2:mem:caresync
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
  graphql:
    graphiql:
      enabled: true
      path: /graphiql

caresync:
  rabbitmq:
    queue: consultas.notificacoes
    exchange: consultas.exchange
    routing-key: consultas.routingkey